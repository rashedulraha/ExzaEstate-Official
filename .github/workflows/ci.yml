name: CI Quality Gates & Pipeline

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint, Boundaries & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.8.2

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @exzaestate/shared build

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Code format check (Prettier)
        run: pnpm format:check

      - name: Lint, boundaries & cycles (oxlint, depcruise, madge)
        run: pnpm lint

      - name: Strict TypeScript typecheck
        run: pnpm typecheck

  quality-gates:
    name: Custom Architecture Quality Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.8.2

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @exzaestate/shared build

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Verify API client contract generation and zero drift
        run: pnpm gen:api && git diff --exit-code packages/api-client/openapi.json packages/api-client/src/generated

      - name: Verify OpenAPI contract additive-only & zero breaking changes
        run: pnpm check:openapi-breaking

      - name: Run all architectural quality checks
        run: pnpm check:all

  tests:
    name: Integration & Unit Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: exza_admin
          POSTGRES_PASSWORD: exza_admin_secret
          POSTGRES_DB: exzaestate
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.8.2

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @exzaestate/shared build

      - name: Initialize PostgreSQL database roles
        run: |
          docker cp docker/postgres-init/01-init-roles.sql ${{ job.services.postgres.id }}:/01-init-roles.sql
          docker exec ${{ job.services.postgres.id }} psql -U exza_admin -d exzaestate -f /01-init-roles.sql

      - name: Apply Prisma migrations
        run: pnpm --filter @exzaestate/backend exec prisma migrate deploy
        env:
          MIGRATOR_DATABASE_URL: postgresql://exza_migrator:exza_migrator_secret@localhost:5432/exzaestate?schema=public

      - name: Run baseline seed
        run: pnpm db:seed
        env:
          DATABASE_URL: postgresql://exza_app:exza_app_secret@localhost:5432/exzaestate?schema=public
          SYSTEM_DATABASE_URL: postgresql://exza_system:exza_system_secret@localhost:5432/exzaestate?schema=public

      - name: Run demo seed
        run: pnpm db:seed:demo
        env:
          DATABASE_URL: postgresql://exza_app:exza_app_secret@localhost:5432/exzaestate?schema=public
          SYSTEM_DATABASE_URL: postgresql://exza_system:exza_system_secret@localhost:5432/exzaestate?schema=public

      - name: Run full test suite (backend & shared)
        run: pnpm test
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://exza_app:exza_app_secret@localhost:5432/exzaestate?schema=public
          MIGRATOR_DATABASE_URL: postgresql://exza_migrator:exza_migrator_secret@localhost:5432/exzaestate?schema=public
          SYSTEM_DATABASE_URL: postgresql://exza_system:exza_system_secret@localhost:5432/exzaestate?schema=public
          REDIS_URL: redis://localhost:6379

  build:
    name: Build Packages & Apps
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.8.2

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Build monorepo packages
        run: pnpm build

  security:
    name: Secret Scanning & Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.8.2

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24.x

      - name: Run Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: false

      - name: Run dependency vulnerability audit
        run: pnpm audit --prod --audit-level=high
